<script type="text/javascript">
(function () {
    function promptImportMode() {
        const answer = window.prompt('Import mode: type "append" to append or "replace" to replace existing entries.', 'append');
        if (!answer) {
            return null;
        }
        const mode = answer.trim().toLowerCase();
        return mode === 'replace' ? 'replace' : mode === 'append' ? 'append' : null;
    }

    function readJsonFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    if (!Array.isArray(parsed)) {
                        reject(new Error('Expected a JSON array'));
                        return;
                    }
                    resolve(parsed);
                } catch (error) {
                    reject(error);
                }
            };
            reader.onerror = () => reject(new Error('Failed to read file'));
            reader.readAsText(file);
        });
    }

    function downloadJsonFile(filename, data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function handleImport(input, currentItems, onLoaded) {
        const file = input.files && input.files[0];
        if (!file) {
            return;
        }
        readJsonFile(file).then((parsed) => {
            const mode = promptImportMode();
            if (!mode) {
                RED.notify('Import cancelled', 'warning');
                input.value = '';
                return;
            }
            const next = mode === 'replace' ? parsed : [...currentItems(), ...parsed];
            onLoaded(next, parsed.length);
            input.value = '';
        }).catch((error) => {
            RED.notify(`Import failed: ${error.message}`, 'error');
            input.value = '';
        });
    }

    function createHint(text) {
        return $('<span/>', {
            title: text,
            text: '?',
            style: 'display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:16px;height:16px;margin-left:4px;border-radius:999px;background:#eef2ff;color:#3b5bdb;font-size:11px;font-weight:700;cursor:help;vertical-align:middle;'
        });
    }

    function uniqueGroupId() {
        return `group-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`;
    }

    function isGroupEntry(entry) {
        return entry?.type === 'group' || Array.isArray(entry?.items);
    }

    function updateContextEditorState(row, collapsed) {
        row.attr('data-collapsed', collapsed ? 'true' : 'false');
        row.find('.node-input-context-body').toggle(!collapsed);
        row.find('.node-input-context-toggle')
            .text(collapsed ? 'Expand' : 'Retract')
            .attr('title', collapsed ? 'Show context fields' : 'Hide context fields');
    }

    function updateGroupState(row, collapsed) {
        row.attr('data-group-collapsed', collapsed ? 'true' : 'false');
        row.find('.node-input-group-body').toggle(!collapsed);
        row.find('.node-input-group-toggle')
            .text(collapsed ? 'Expand' : 'Retract')
            .attr('title', collapsed ? 'Show group content' : 'Hide group content');
    }

    function updateOptionsState(row, collapsed) {
        row.attr('data-options-collapsed', collapsed ? 'true' : 'false');
        row.find('.node-input-group-options-body').toggle(!collapsed);
        row.find('.node-input-group-options-toggle')
            .text(collapsed ? 'Expand' : 'Retract')
            .attr('title', collapsed ? 'Show group options' : 'Hide group options');
    }

    function createOptionField(labelText, hintText) {
        const field = $('<div/>', { style: 'display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #eef2f7;' });
        const labelWrap = $('<div/>', { style: 'display:flex;align-items:center;gap:4px;min-width:150px;font-weight:600;color:#334155;' }).appendTo(field);
        $('<span/>').text(labelText).appendTo(labelWrap);
        if (hintText) {
            createHint(hintText).appendTo(labelWrap);
        }
        const controlWrap = $('<div/>', { style: 'display:flex;align-items:center;gap:8px;justify-content:flex-end;flex:1;min-width:0;' }).appendTo(field);
        return { field, controlWrap };
    }

    function draftStorageKey(nodeId) {
        return `voxta-context-draft:${nodeId || 'new'}`;
    }

    function loadDraftEntries(nodeId) {
        try {
            const raw = window.localStorage.getItem(draftStorageKey(nodeId));
            if (!raw) {
                return null;
            }
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : null;
        } catch (_error) {
            return null;
        }
    }

    function clearDraftEntries(nodeId) {
        try {
            window.localStorage.removeItem(draftStorageKey(nodeId));
        } catch (_error) {
        }
    }

    function saveDraftEntries(container, nodeId) {
        try {
            window.localStorage.setItem(draftStorageKey(nodeId), JSON.stringify(readEntries(container)));
        } catch (_error) {
        }
    }

    function scheduleDraftSave(container, nodeId) {
        const existingTimer = container.data('draftSaveTimer');
        if (existingTimer) {
            window.clearTimeout(existingTimer);
        }
        const timer = window.setTimeout(function () {
            saveDraftEntries(container, nodeId);
        }, 150);
        container.data('draftSaveTimer', timer);
    }


    function captureFormValues(row) {
        return row.find('input, textarea, select').map(function () {
            const element = $(this);
            const type = String(this.type || '').toLowerCase();
            return type === 'checkbox' || type === 'radio'
                ? { kind: 'checked', value: element.is(':checked') }
                : { kind: 'value', value: element.val() };
        }).get();
    }

    function restoreFormValues(row, values) {
        row.find('input, textarea, select').each(function (index) {
            const saved = values[index];
            if (!saved) {
                return;
            }
            const element = $(this);
            if (saved.kind === 'checked') {
                element.prop('checked', !!saved.value);
                return;
            }
            element.val(saved.value);
        });
    }
    function createContextEditor(context) {
        const row = $('<div/>', { class: 'noxy-context-row voxta-context-item', 'data-entry-type': 'context', style: 'border:1px solid #d9deea;border-radius:10px;padding:12px;margin-bottom:10px;background:linear-gradient(180deg,#ffffff 0%,#fafbff 100%);box-shadow:0 1px 3px rgba(15,23,42,0.06);' });
        const line1 = $('<div/>', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;' }).appendTo(row);
        $('<div/>', { class: 'voxta-context-drag', text: '|||', style: 'cursor:move;color:#64748b;font-size:13px;line-height:30px;padding:0 4px;font-weight:700;' }).appendTo(line1);
        $('<input/>', { class: 'node-input-context-name', type: 'text', placeholder: 'Context name', style: 'flex:1;min-width:180px;' }).val(context?.name || context?.Name || '').appendTo(line1);
        const disabledLabel = $('<label/>', { style: 'display:flex;align-items:center;gap:4px;white-space:nowrap;margin:0;' }).appendTo(line1);
        $('<input/>', { class: 'node-input-context-disabled', type: 'checkbox' }).prop('checked', !!context?.disabled || !!context?.Disabled).appendTo(disabledLabel);
        $('<span/>').text('Disabled').appendTo(disabledLabel);
        createHint('If enabled, this context starts disabled until explicitly activated.').appendTo(disabledLabel);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-context-toggle' }).text('Retract').appendTo(line1);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-context-remove' }).text('Remove').appendTo(line1);

        const body = $('<div/>', { class: 'node-input-context-body' }).appendTo(row);
        $('<textarea/>', { class: 'node-input-context-text', placeholder: 'Context text', style: 'width:100%;min-height:72px;margin-bottom:6px;' })
            .val(context?.text || context?.Text || '')
            .appendTo(body);
        $('<input/>', { class: 'node-input-context-flags', type: 'text', placeholder: 'Set flags, comma separated', style: 'width:100%;' })
            .val(Array.isArray(context?.setFlags || context?.SetFlags) ? (context.setFlags || context.SetFlags).join(', ') : '')
            .appendTo(body);

        const autoRemoveSeconds = context?.autoRemoveSeconds ?? context?.AutoRemoveSeconds ?? context?.removeAfterSeconds ?? context?.RemoveAfterSeconds ?? '';
        const autoRemoveRaw = context?.autoRemove ?? context?.AutoRemove ?? context?.autoRemoveEnabled ?? context?.AutoRemoveEnabled;
        const autoRemoveEnabled = autoRemoveRaw === undefined || autoRemoveRaw === null || autoRemoveRaw === ''
            ? Number(autoRemoveSeconds) > 0
            : autoRemoveRaw === true || autoRemoveRaw === 1 || autoRemoveRaw === '1' || autoRemoveRaw === 'true';
        const autoRemoveRow = $('<div/>', { style: 'display:flex;align-items:center;gap:8px;margin-top:8px;padding:7px 8px;border:1px solid #eef2f7;border-radius:8px;background:#f8faff;' }).appendTo(body);
        const autoRemoveLabel = $('<label/>', { style: 'display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap;font-weight:600;color:#334155;' }).appendTo(autoRemoveRow);
        const autoRemoveCheckbox = $('<input/>', { class: 'node-input-context-auto-remove', type: 'checkbox' })
            .prop('checked', autoRemoveEnabled)
            .appendTo(autoRemoveLabel);
        $('<span/>').text('By time').appendTo(autoRemoveLabel);
        createHint('When checked, this context auto-injects after the configured delay (seconds) on chat start. Context stays active — no auto-remove. Uncheck to disable.').appendTo(autoRemoveLabel);
        const autoRemoveInput = $('<input/>', {
            class: 'node-input-context-auto-remove-seconds',
            type: 'number',
            min: '0',
            step: '0.1',
            placeholder: 'seconds',
            style: 'width:100px;text-align:right;'
        }).val(autoRemoveSeconds).prop('disabled', !autoRemoveEnabled).appendTo(autoRemoveRow);
        $('<span/>', { style: 'color:#64748b;white-space:nowrap;' }).text('sec').appendTo(autoRemoveRow);
        autoRemoveCheckbox.on('change', function () {
            autoRemoveInput.prop('disabled', !$(this).is(':checked'));
        });

        const autoRemoveMessages = context?.autoRemoveMessages ?? context?.AutoRemoveMessages ?? context?.removeAfterMessages ?? context?.RemoveAfterMessages ?? '';
        const autoRemoveMessagesRaw = context?.autoRemoveByMessages ?? context?.AutoRemoveByMessages ?? context?.autoRemoveMessagesEnabled ?? context?.AutoRemoveMessagesEnabled;
        const autoRemoveMessagesEnabled = autoRemoveMessagesRaw === undefined || autoRemoveMessagesRaw === null || autoRemoveMessagesRaw === ''
            ? Number(autoRemoveMessages) > 0
            : autoRemoveMessagesRaw === true || autoRemoveMessagesRaw === 1 || autoRemoveMessagesRaw === '1' || autoRemoveMessagesRaw === 'true';
        const autoRemoveMessagesRow = $('<div/>', { style: 'display:flex;align-items:center;gap:8px;margin-top:4px;padding:7px 8px;border:1px solid #eef2f7;border-radius:8px;background:#f8faff;' }).appendTo(body);
        const autoRemoveMessagesLabel = $('<label/>', { style: 'display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap;font-weight:600;color:#334155;' }).appendTo(autoRemoveMessagesRow);
        const autoRemoveMessagesCheckbox = $('<input/>', { class: 'node-input-context-auto-remove-messages-enabled', type: 'checkbox' })
            .prop('checked', autoRemoveMessagesEnabled)
            .appendTo(autoRemoveMessagesLabel);
        $('<span/>').text('By replies').appendTo(autoRemoveMessagesLabel);
        createHint('When checked, this context auto-injects after the configured number of assistant replies on chat start. Context stays active — no auto-remove. Uncheck to disable.').appendTo(autoRemoveMessagesLabel);
        const autoRemoveMessagesInput = $('<input/>', {
            class: 'node-input-context-auto-remove-messages',
            type: 'number',
            min: '1',
            step: '1',
            placeholder: 'replies',
            style: 'width:100px;text-align:right;'
        }).val(autoRemoveMessages).prop('disabled', !autoRemoveMessagesEnabled).appendTo(autoRemoveMessagesRow);
        $('<span/>', { style: 'color:#64748b;white-space:nowrap;' }).text('replies').appendTo(autoRemoveMessagesRow);
        autoRemoveMessagesCheckbox.on('change', function () {
            autoRemoveMessagesInput.prop('disabled', !$(this).is(':checked'));
        });

        row.on('click', '.node-input-context-remove', function () { row.remove(); });
        row.on('click', '.node-input-context-toggle', function () {
            updateContextEditorState(row, row.attr('data-collapsed') !== 'true');
        });
        updateContextEditorState(row, !!context?.uiCollapsed || !!context?.UiCollapsed);
        return row;
    }

    function createGroupEditor(group) {
        const row = $('<div/>', { class: 'voxta-context-group', 'data-entry-type': 'group', 'data-group-id': group?.id || uniqueGroupId(), style: 'border:1px solid #cfd8ea;border-radius:12px;padding:12px;margin-bottom:10px;background:linear-gradient(180deg,#fdfefe 0%,#f5f8ff 100%);box-shadow:0 1px 3px rgba(15,23,42,0.05);' });
        const header = $('<div/>', { style: 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;' }).appendTo(row);
        $('<div/>', { class: 'voxta-context-drag', text: '|||', style: 'cursor:move;color:#64748b;font-size:13px;line-height:30px;padding:0 4px;font-weight:700;' }).appendTo(header);
        $('<input/>', { class: 'node-input-group-name', type: 'text', placeholder: 'Group name', style: 'flex:1;min-width:180px;' }).val(group?.name || '').appendTo(header);
        $('<span/>', { style: 'color:#64748b;font-size:12px;padding:0 4px;' }).text('Group').appendTo(header);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-group-toggle' }).text('Retract').appendTo(header);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-group-remove' }).text('Remove').appendTo(header);

        const body = $('<div/>', { class: 'node-input-group-body', style: 'margin-top:10px;' }).appendTo(row);

        const optionsWrap = $('<div/>', { style: 'margin-bottom:10px;padding:10px;border:1px solid #e6eaf3;border-radius:10px;background:#f8faff;' }).appendTo(body);
        const optionsHeader = $('<div/>', { style: 'display:flex;align-items:center;justify-content:space-between;gap:8px;' }).appendTo(optionsWrap);
        $('<div/>', { style: 'display:flex;align-items:center;gap:4px;font-weight:600;color:#334155;' })
            .append($('<span/>').text('Options'))
            .append(createHint('Group-level behavior such as exclusive activation and automatic injection.'))
            .appendTo(optionsHeader);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-group-options-toggle' }).text('Retract').appendTo(optionsHeader);

        const optionsBody = $('<div/>', { class: 'node-input-group-options-body', style: 'margin-top:10px;' }).appendTo(optionsWrap);

        const mutualField = createOptionField('Mutual exclusive', 'Only one context in this group can stay active. Triggering the group activates the first context and disables the rest. Triggering a context inside the group activates that one and disables the others.');
        $('<label/>', { style: 'display:flex;align-items:center;gap:6px;white-space:nowrap;margin:0;' })
            .append($('<input/>', { class: 'node-input-group-mutual-exclusive', type: 'checkbox' }).prop('checked', !!group?.mutualExclusive || !!group?.MutualExclusive))
            .append($('<span/>').text('Enabled'))
            .appendTo(mutualField.controlWrap);
        mutualField.field.appendTo(optionsBody);

        const autoInjectField = createOptionField('Autoinject', 'Leave empty to disable autoinject. If you enter a number, the group will inject automatically after that many seconds when a chat starts.');
        $('<input/>', { class: 'node-input-group-autoinject-seconds', type: 'number', min: '0', step: '1', placeholder: 'seconds', style: 'width:120px;text-align:right;' })
            .val(group?.autoInjectSeconds ?? group?.AutoInjectSeconds ?? '')
            .appendTo(autoInjectField.controlWrap);
        $('<span/>', { style: 'color:#64748b;white-space:nowrap;' }).text('sec').appendTo(autoInjectField.controlWrap);
        autoInjectField.field.appendTo(optionsBody);

        const meta = $('<div/>', { style: 'display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;' }).appendTo(body);
        $('<div/>', { style: 'display:flex;align-items:center;gap:4px;font-weight:600;color:#334155;' })
            .append($('<span/>').text('Grouped contexts'))
            .append(createHint('Drag contexts in or out of this group. Trigger the whole group by its name or with group:MyGroup.'))
            .appendTo(meta);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-group-add-context' }).text('Add context').appendTo(meta);

        $('<div/>', { class: 'voxta-context-dropzone node-input-group-items', style: 'min-height:22px;padding:6px;border:1px dashed #cbd5e1;border-radius:8px;background:#ffffff;' }).appendTo(body);

        row.on('click', '.node-input-group-remove', function () { row.remove(); });
        row.on('click', '.node-input-group-toggle', function () {
            updateGroupState(row, row.attr('data-group-collapsed') !== 'true');
        });
        row.on('click', '.node-input-group-options-toggle', function () {
            updateOptionsState(row, row.attr('data-options-collapsed') !== 'true');
        });
        row.on('click', '.node-input-group-add-context', function () {
            row.find('.node-input-group-items').append(createContextEditor({}));
            initializeSortables($('#node-input-contexts-container'));
        });

        (group?.items || []).forEach((entry) => row.find('.node-input-group-items').append(createEntryEditor(entry)));
        updateGroupState(row, !!group?.uiCollapsed || !!group?.UiCollapsed);
        updateOptionsState(row, !!group?.uiOptionsCollapsed || !!group?.UiOptionsCollapsed);
        return row;
    }

    function createEntryEditor(entry) {
        return isGroupEntry(entry) ? createGroupEditor(entry) : createContextEditor(entry || {});
    }

    function updateContextContainer(container, entries) {
        container.empty();
        entries.forEach((entry) => container.append(createEntryEditor(entry)));
        initializeSortables(container);
    }

    function initializeSortables(container) {
        if (!$.fn.sortable) {
            return;
        }

        const topLevel = container;
        const groupLists = container.find('.node-input-group-items');
        const allLists = topLevel.add(groupLists);

        allLists.each(function () {
            const list = $(this);
            if (list.hasClass('ui-sortable')) {
                list.sortable('destroy');
            }
        });

        topLevel.sortable({
            handle: '.voxta-context-drag',
            items: '> .voxta-context-item, > .voxta-context-group',
            connectWith: '.voxta-context-dropzone, #node-input-contexts-container',
            placeholder: 'voxta-sort-placeholder',
            start: function (_event, ui) {
                ui.item.data('liveValues', captureFormValues(ui.item));
            },
            stop: function (_event, ui) {
                restoreFormValues(ui.item, ui.item.data('liveValues') || []);
                container.trigger('voxta:changed');
            }
        });
        groupLists.sortable({
            handle: '.voxta-context-drag',
            items: '> .voxta-context-item',
            connectWith: '.node-input-group-items, #node-input-contexts-container',
            placeholder: 'voxta-sort-placeholder',
            start: function (_event, ui) {
                ui.item.data('liveValues', captureFormValues(ui.item));
            },
            stop: function (_event, ui) {
                restoreFormValues(ui.item, ui.item.data('liveValues') || []);
                container.trigger('voxta:changed');
            },
            receive: function (_event, ui) {
                if (ui.item.attr('data-entry-type') === 'group') {
                    $(this).sortable('cancel');
                    return;
                }
                restoreFormValues(ui.item, ui.item.data('liveValues') || []);
                container.trigger('voxta:changed');
            }
        });
    }

    function readContextRow(row) {
        const context = {
            type: 'context',
            name: row.find('.node-input-context-name').val().trim(),
            text: row.find('.node-input-context-text').val().trim(),
            disabled: row.find('.node-input-context-disabled').is(':checked'),
            setFlags: row.find('.node-input-context-flags').val().split(',').map((value) => value.trim()).filter(Boolean),
            autoRemove: row.find('.node-input-context-auto-remove').is(':checked'),
            autoRemoveSeconds: row.find('.node-input-context-auto-remove-seconds').val().trim(),
            autoRemoveByMessages: row.find('.node-input-context-auto-remove-messages-enabled').is(':checked'),
            autoRemoveMessages: row.find('.node-input-context-auto-remove-messages').val().trim(),
            uiCollapsed: row.attr('data-collapsed') === 'true'
        };
        const hasContent = !!context.name || !!context.text || context.setFlags.length > 0 || context.disabled || context.autoRemove || context.autoRemoveByMessages;
        return hasContent ? context : null;
    }

    function readEntries(container) {
        const entries = [];
        container.children('[data-entry-type]').each(function () {
            const row = $(this);
            const entryType = row.attr('data-entry-type');
            if (entryType === 'group') {
                const name = row.find('.node-input-group-name').val().trim();
                const childEntries = readEntries(row.find('.node-input-group-items'));
                if (!name) {
                    entries.push(...childEntries);
                    return;
                }
                entries.push({
                    type: 'group',
                    id: row.attr('data-group-id') || uniqueGroupId(),
                    name,
                    mutualExclusive: row.find('.node-input-group-mutual-exclusive').is(':checked'),
                    autoInjectSeconds: row.find('.node-input-group-autoinject-seconds').val().trim(),
                    uiCollapsed: row.attr('data-group-collapsed') === 'true',
                    uiOptionsCollapsed: row.attr('data-options-collapsed') === 'true',
                    items: childEntries
                });
                return;
            }

            const context = readContextRow(row);
            if (context) {
                entries.push(context);
            }
        });
        return entries;
    }

    const voxtaContextDefinition = {
        category: 'Voxta',
        color: '#f6f7fb',
        defaults: {
            name: { value: '' },
        linkTarget: { value: false },
            client: {
                value: '',
                type: 'signalr-client',
                required: true,
                validate: function (value) { return RED.nodes.node(value) != null; }
            },
            sessionId: { value: '' },
            charId: { value: '' },
            contextKey: { value: '' },
            contextText: { value: '' },
            setFlags: { value: '' },
            disabled: { value: false },
            contexts: { value: [] }
        },
        inputs: 1,
        outputs: 1,
        icon: 'voxta.png',
        label: function () {
            return this.name || 'Context';
        },
        oneditprepare: function () {
            // === Character chip UI ===
            (function setupCharChips() {
                const chipContainer = $('#voxta-char-chips');
                const charInput = $('#voxta-char-input');
                const hiddenInput = $('#node-input-charId');
                let characterList = [];
                let selectedChars = [];

                // Load existing value
                const existing = hiddenInput.val().trim();
                if (existing) {
                    selectedChars = existing.split(/[,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
                }

                function renderChips() {
                    chipContainer.find('.voxta-char-chip').remove();
                    selectedChars.forEach(function (name) {
                        const chip = $('<div/>', {
                            class: 'voxta-char-chip',
                            style: 'display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;background:#eef2ff;color:#3b5bdb;font-size:12px;font-weight:600;'
                        }).insertBefore(charInput);
                        $('<span/>').text(name).attr('title', (characterList.find(function(c){return c.name===name;})||{}).notes||'').appendTo(chip);
                        $('<button/>', {
                            type: 'button',
                            style: 'border:none;background:none;color:#3b5bdb;cursor:pointer;font-weight:700;padding:0 0 0 2px;font-size:14px;line-height:1;',
                            text: '\u2715'
                        }).on('click', function () {
                            selectedChars = selectedChars.filter(function (n) { return n !== name; });
                            updateHidden();
                            renderChips();
                        }).appendTo(chip);
                    });
                }

                function updateHidden() {
                    hiddenInput.val(selectedChars.join(', '));
                }

                function addChar(name) {
                    name = name.trim();
                    if (!name) return;
                    if (selectedChars.some(function (n) { return n.toLowerCase() === name.toLowerCase(); })) return;
                    const match = characterList.find(function (c) { return c.name.toLowerCase() === name.toLowerCase(); });
                    if (match) {
                        selectedChars.push(match.name);
                    } else {
                        selectedChars.push(name);
                    }
                    updateHidden();
                    renderChips();
                    charInput.val('');
                }

                function fetchCharacters() {
                    const clientId = $('#node-input-client').val();
                    if (!clientId) return;
                    $.getJSON('voxta-config/characters?clientId=' + encodeURIComponent(clientId), function (data) {
                        characterList = data || [];
                    }).fail(function () {});
                }

                charInput.on('keydown', function (e) {
                    if (e.which === 13 || e.keyCode === 13) {
                        e.preventDefault();
                        addChar($(this).val());
                    }
                });

                charInput.on('input', function () {
                    const val = $(this).val().toLowerCase().trim();
                    $('#voxta-char-dropdown').remove();
                    if (!val || characterList.length === 0) return;
                    const matches = characterList.filter(function (c) {
                        return c.name.toLowerCase().indexOf(val) >= 0;
                    }).slice(0, 10);
                    if (matches.length === 0) return;
                    const dropdown = $('<div/>', {
                        id: 'voxta-char-dropdown',
                        style: 'position:absolute;z-index:1000;background:#fff;border:1px solid #dde3f0;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);max-height:200px;overflow-y:auto;min-width:200px;'
                    }).appendTo($('body'));
                    const offset = charInput.offset();
                    dropdown.css({ top: offset.top + charInput.outerHeight(), left: offset.left });
                    matches.forEach(function (c) {
                        $('<div/>', {
                            style: 'padding:4px 12px;cursor:pointer;font-size:13px;'
                        }).text(c.name).attr('title', c.notes || '').on('mouseenter', function () { $(this).css('background', '#eef2ff'); })
                          .on('mouseleave', function () { $(this).css('background', '#fff'); })
                          .on('click', function () { addChar(c.name); dropdown.remove(); })
                          .appendTo(dropdown);
                    });
                    setTimeout(function () {
                        $(document).one('click', function () { dropdown.remove(); });
                    }, 100);
                });

                // Discover button — fetch characters from Voxta on demand
                $('#voxta-char-discover').off('click').on('click', function () {
                    const clientId = $('#node-input-client').val();
                    if (!clientId) {
                        $('#voxta-char-status').text('Select a Voxta client first').css('color', '#d9534f');
                        return;
                    }
                    $('#voxta-char-status').text('Discovering...').css('color', '#64748b');
                    $.getJSON('voxta-config/characters?clientId=' + encodeURIComponent(clientId), function (data) {
                        characterList = data || [];
                        $('#voxta-char-status').text(characterList.length + ' characters found').css('color', '#3b5bdb');
                    }).fail(function (jqXHR) {
                        let msg = 'Discover failed';
                        if (jqXHR.responseJSON && jqXHR.responseJSON.error) msg = jqXHR.responseJSON.error;
                        $('#voxta-char-status').text(msg).css('color', '#d9534f');
                    });
                });
                fetchCharacters();
                renderChips();
            })();

            const container = $('#node-input-contexts-container');
            const nodeId = this.id || 'new';
            const draftEntries = loadDraftEntries(nodeId);
            const initialEntries = Array.isArray(draftEntries) ? draftEntries : (Array.isArray(this.contexts) ? this.contexts : []);
            updateContextContainer(container, initialEntries);
            if (Array.isArray(draftEntries)) {
                RED.notify('Restored unsaved context draft', 'info');
            }

            container.off('.voxtaDraft');
            container.on('input.voxtaDraft change.voxtaDraft', 'input, textarea, select', function () {
                scheduleDraftSave(container, nodeId);
            });
            container.on('voxta:changed.voxtaDraft', function () {
                scheduleDraftSave(container, nodeId);
            });
            container.on('click.voxtaDraft', '.node-input-context-remove, .node-input-group-remove, .node-input-group-add-context, .node-input-context-toggle, .node-input-group-toggle, .node-input-group-options-toggle', function () {
                window.setTimeout(function () {
                    scheduleDraftSave(container, nodeId);
                }, 0);
            });

            $('#node-input-add-context').off('click').on('click', function () {
                container.append(createContextEditor({}));
                initializeSortables(container);
                scheduleDraftSave(container, nodeId);
            });
            $('#node-input-add-group').off('click').on('click', function () {
                container.append(createGroupEditor({ type: 'group', id: uniqueGroupId(), name: '', items: [] }));
                initializeSortables(container);
                scheduleDraftSave(container, nodeId);
            });
            $('#node-input-export-contexts').off('click').on('click', () => {
                downloadJsonFile('voxta-contexts.json', readEntries(container));
            });
            $('#node-input-import-contexts').off('click').on('click', () => {
                $('#node-input-import-contexts-file').trigger('click');
            });
            $('#node-input-import-contexts-file').off('change').on('change', (event) => {
                handleImport(event.target, () => readEntries(container), (next, count) => {
                    this.contexts = next;
                    updateContextContainer(container, next);
                    saveDraftEntries(container, nodeId);
                    RED.notify(`Imported ${count} context/group entr${count === 1 ? 'y' : 'ies'}`, 'success');
                });
            });
            $('#node-input-clear-contexts').off('click').on('click', () => {
                if (!window.confirm('Delete all contexts and groups?')) {
                    return;
                }
                this.contexts = [];
                container.empty();
                saveDraftEntries(container, nodeId);
            });
        },
        oneditsave: function () {
            this.contexts = readEntries($('#node-input-contexts-container'));
            clearDraftEntries(this.id || 'new');
        }
    };
    RED.nodes.registerType('context', voxtaContextDefinition);
})();
</script>

<script type="text/html" data-template-name="context">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-linkTarget" style="cursor:help;" title="Enable this node as a link target for the Link relay node."><i class="fa fa-link"></i> Link</label>
        <input type="checkbox" id="node-input-linkTarget" style="display:inline-block;width:auto;margin-right:4px;">
        <label for="node-input-linkTarget" style="width:auto;display:inline-block;font-size:12px;color:#64748b;">Enable this node as link target</label>
    </div>
    <div class="form-row">
        <label for="node-input-client" title="Configure here your SignalR Client connection to your Voxta installation" style="cursor:help;"><i class="fa fa-plug"></i> Voxta</label>
        <input type="text" id="node-input-client">
    </div>
    <input type="hidden" id="node-input-sessionId">
    <div class="form-row">
        <label for="node-input-charId" title="Assign this node to specific characters. If empty, this node will always be active for all characters." style="cursor:help;"><i class="fa fa-user"></i> Char ID</label>
        <input type="hidden" id="node-input-charId">
        <div id="voxta-char-chips" style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:28px;padding:2px 6px;border:1px solid #dde3f0;border-radius:6px;background:#f8faff;">
            <input type="text" id="voxta-char-input" placeholder="Type a character name..." style="border:none;outline:none;flex:1;min-width:180px;background:transparent;font-size:13px;">
        </div>
        <button type="button" class="red-ui-button red-ui-button-small" id="voxta-char-discover" style="margin-left:6px;"><i class="fa fa-search"></i> Discover</button>
        <span id="voxta-char-status" style="margin-left:4px;color:#64748b;font-size:12px;"></span>
    </div>
    <input type="hidden" id="node-input-contextKey">
    <input type="hidden" id="node-input-contextText">
    <div class="form-row" style="margin-bottom:6px;">
        <label><i class="fa fa-book"></i> Context Presets</label>
        <button type="button" class="red-ui-button" id="node-input-add-context">Add preset</button>
        <button type="button" class="red-ui-button" id="node-input-add-group">Add group</button>
        <button type="button" class="red-ui-button" id="node-input-import-contexts">Import</button>
        <button type="button" class="red-ui-button" id="node-input-export-contexts">Export</button>
        <button type="button" class="red-ui-button" id="node-input-clear-contexts">Delete all</button>
        <input type="file" id="node-input-import-contexts-file" accept=".json,application/json" style="display:none;">
    </div>
    <div class="form-row">
        <div id="node-input-contexts-container" class="voxta-context-dropzone" style="width:100%;min-height:28px;"></div>
    </div>
    <div class="form-tips">
        <p>Send a configured context name to apply it. Group names also work. Use <code>group:MyGroup</code> for an explicit group reference. Use <code>name!</code> or <code>!name</code> to send the target context or group disabled.</p>
        <p><b>Auto-inject:</b> A standalone context (not in a group) auto-injects when either <b>By time</b> or <b>By replies</b> is checked. <b>By time</b> = inject after N seconds delay. <b>By replies</b> = inject after N assistant replies. The context stays active once injected — no auto-remove. Uncheck both to disable. Group-level auto-inject uses the group's <b>Autoinject</b> seconds field instead.</p>
        <p>Dynamic JSON is also accepted, for example: <code>{"contextKey":"Weather","text":"A thunderstorm is approaching.","autoRemoveByMessages":true,"autoRemoveMessages":1}</code>. You may instead provide a <code>contexts</code> array; expiry fields can be set globally or per context.</p>
    </div>
</script>

<script type="text/html" data-help-name="context">
    <p>Manage and inject context into Voxta chat sessions. Send configured references or dynamic JSON from upstream nodes.</p>
    <p>Configured references: <code>PresetName</code>, <code>group:GroupName</code>, or prefix/suffix <code>!</code> to disable.</p>
    <p>Dynamic JSON: provide <code>contextKey</code> (or <code>name</code>) plus <code>text</code>, or a Voxta-style <code>contexts</code> array. Optional fields include <code>setFlags</code>, <code>disabled</code>, <code>autoRemove</code>, <code>autoRemoveSeconds</code>, <code>autoRemoveByMessages</code>, and <code>autoRemoveMessages</code>.</p>
    <p>Time and reply-count expiry are session- and context-specific; when both are enabled, the first one reached wins. Reinjecting the same context replaces its previous expiry state, and closing the chat cancels pending removals.</p>
</script>
